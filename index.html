<link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Polices intégrées au jeu (licence SIL OFL, voir assets/fonts) : elles marchent sans connexion */
@font-face{font-family:'Big Shoulders Display';font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:900;font-style:normal;font-display:swap;src:url(assets/fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-style:normal;font-display:swap;src:url(assets/fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url(assets/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url(assets/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/inter-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#10131C; --surface:#1A1F2C; --surface2:#252B3A; --line:#2A3142; --line2:#3A4256;
  --text:#EDE6D6; --text2:#C9CFDB; --muted:#9AA3B5;
  --yellow:#F5C542; --red:#E5533D; --blue:#6FB7FF; --green:#8FD694; --paper:#E8DFC9;
  --display:'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --body:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--yellow)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.display{font-family:var(--display);font-weight:900;line-height:.92;margin:0;letter-spacing:.5px}
.h-xl{font-size:clamp(64px,22vw,104px)}
.h-l{font-size:clamp(42px,13vw,56px)}
.h-m{font-size:clamp(32px,10vw,42px)}
.muted{color:var(--muted)} .text2{color:var(--text2)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.push{margin-top:auto}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;min-height:58px;padding:0 18px;border-radius:16px;border:0;
  background:var(--yellow);color:var(--bg);font-weight:700;font-size:17px;text-decoration:none;width:100%}
.btn.red{background:var(--red)} .btn.blue{background:var(--blue)} .btn.green{background:var(--green)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:600;font-size:15px;min-height:52px}
.btn.small{min-height:44px;font-size:14px;width:auto}
.link{background:none;border:0;color:var(--yellow);font-size:14px;text-decoration:underline;padding:10px;align-self:center}
.icon-btn{display:flex;justify-content:center;align-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface);border:0;color:var(--text);flex-shrink:0}
.card{background:var(--surface);border-radius:16px;padding:14px}
.list{display:flex;flex-direction:column;border-radius:14px;background:var(--surface);overflow:hidden}
.list>.item{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--surface2)}
.list>.item:last-child{border-bottom:0}
.avatar{display:flex;justify-content:center;align-items:center;width:32px;height:32px;border-radius:50%;color:var(--bg);font-weight:700;font-size:14px;flex-shrink:0}
.pname{flex:1;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface2);font-size:20px}
.stepper span{min-width:34px;text-align:center;font-family:var(--mono);font-weight:600}
.toggle{width:52px;height:32px;border-radius:16px;border:0;background:var(--line2);position:relative;flex-shrink:0}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle.on{background:var(--yellow)} .toggle.on::after{left:24px;background:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface)}
.seg button{min-height:46px;border-radius:10px;border:0;background:transparent;color:var(--text2);font-weight:600;font-size:14px}
.seg button.on{background:var(--yellow);color:var(--bg);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text2);font-weight:600;font-size:13px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.tgt{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;color:var(--text)}
.chip.tgt.on-red{background:#2A1A1A;border:2px solid var(--red);color:var(--text)}
.input{flex:1;min-width:0;height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 14px;font:inherit;font-size:16px}
.input:focus{outline:2px solid var(--yellow);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:var(--mono);font-weight:600;letter-spacing:3px;padding:5px 10px;border-radius:4px;transform:rotate(-10deg)}
.dossier{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:360px;border-radius:20px;border:0;
  background:var(--paper);color:#10131C;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:24px 18px;width:100%;overflow:hidden}
.dossier .tab{position:absolute;top:0;left:24px;width:120px;height:20px;border-radius:0 0 10px 10px;background:#D6CBAF}
.dossier .label{position:absolute;top:30px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:#6B6250}
.word{font-family:var(--display);font-weight:900;font-size:clamp(40px,13vw,60px);line-height:.95;text-align:center;word-break:keep-all;overflow-wrap:normal;max-width:100%}
.fit{word-break:keep-all;overflow-wrap:normal;max-width:100%}
.pill{padding:6px 12px;border-radius:999px;background:#10131C;color:var(--paper);font-size:12px;font-weight:600}
.ring{position:relative;width:176px;height:176px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big-avatar{display:flex;justify-content:center;align-items:center;border-radius:50%;color:var(--bg);font-family:var(--display);font-weight:900}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.suspect{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 14px;border-radius:16px;border:2px solid var(--surface);background:var(--surface);color:var(--text)}
.suspect.on{border-color:var(--red);background:#2A1A1A}
.suspect .pname{flex:none;max-width:100%}
.vote-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);color:var(--text);text-align:left;width:100%}
.vote-card .ic{display:flex;justify-content:center;align-items:center;width:52px;height:52px;border-radius:14px;background:var(--surface2);flex-shrink:0}
.score-row{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;background:var(--surface)}
.delta{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:30px;text-align:right}
.delta.plus{color:var(--green)}
.total{font-family:var(--mono);font-weight:600;font-size:16px;min-width:34px;text-align:right}
.video-box{position:relative;flex:1;min-height:420px;border-radius:20px;overflow:hidden;background:#15284B}
.video-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-box .skip{position:absolute;top:12px;right:12px;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:rgba(16,19,28,.72);color:var(--text);font-weight:600;font-size:14px}
.theme-row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px 8px 14px;border-bottom:1px solid var(--surface2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--text)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check.on{background:var(--yellow);border-color:var(--yellow)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:4px;background:var(--blue)}
.hint{font-size:13px;line-height:1.45;color:var(--muted)}
.rules h3{font-size:16px;margin:8px 0 4px;color:var(--yellow)}
.rules p,.rules li{font-size:15px;line-height:1.55;color:var(--text2)}
.rules ul{padding-left:20px;margin:4px 0}
.flash{animation:flash .6s ease 2}
@keyframes flash{50%{background:#3a1a1a}}
/* Révélation */
.suspense-avatar{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
.scanbar{width:220px;height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.scanbar span{display:block;height:6px;width:0;background:var(--yellow);animation:scan 2.1s ease-in forwards}
@keyframes scan{to{width:100%}}
.dots::after{content:'';animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.stamp.slam{transform:rotate(12deg);animation:slam .45s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.15s;background:rgba(26,31,44,.85)}
@keyframes slam{0%{opacity:0;transform:scale(3.2) rotate(-8deg)}70%{opacity:1;transform:scale(.92) rotate(14deg)}100%{opacity:1;transform:scale(1) rotate(12deg)}}
.reveal-title{animation:pop .4s ease both}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
/* Fenêtre de confirmation maison */
.modal-back{position:fixed;inset:0;background:rgba(6,8,12,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px);animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:448px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px;animation:rise .2s ease}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0;font-family:var(--display);font-weight:900;font-size:32px;line-height:1}
.modal p{margin:0;font-size:15px;line-height:1.5;color:var(--text2)}
@media (prefers-reduced-motion: reduce){.suspense-avatar,.stamp.slam,.reveal-title,.modal,.modal-back{animation:none}.scanbar span{animation-duration:.01s}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:10;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){.screen{animation:none}}
</style>

<script src="paires.js"></script>
<script>
(function () {
'use strict';

/* =========================================================
   Données et stockage
   ========================================================= */
var THEMES = window.LA_TAUPE_THEMES || [];
var COLORS = ['#F5C542','#6FB7FF','#F28B66','#8FD694','#C7A2FF','#FF8FB1','#5FD4C8','#FFB347','#A3B8FF','#E8DFC9','#B5E36B','#FF7A7A'];
var LEVELS = { F: 'Facile', M: 'Moyen', E: 'Expert' };

function load(key, def) {
  try { var v = localStorage.getItem('lataupe.' + key); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem('lataupe.' + key, JSON.stringify(val)); } catch (e) {}
}

var defaultThemes = THEMES.filter(function (t) { return t.groupe === 'Grand public'; }).map(function (t) { return t.id; });
var S = {
  screen: 'home',
  players: load('players', []),
  settings: Object.assign({ mode: 'recrue', taupes: 1, fantome: true, tours: 2, chrono: 20, autoGo: false,
    niveaux: { F: true, M: true, E: true }, debat: 0 }, load('settings', {})),
  themesOn: load('themesOn', defaultThemes),
  history: load('history', {}),
  manche: load('manche', 0),
  starts: load('starts', {}),
  lastStarter: load('lastStarter', null),
  lastDistFirst: load('lastDistFirst', null),
  round: null,
  ui: {}
};
function persist() {
  save('players', S.players); save('settings', S.settings); save('themesOn', S.themesOn);
  save('history', S.history); save('manche', S.manche);
  save('starts', S.starts); save('lastStarter', S.lastStarter); save('lastDistFirst', S.lastDistFirst);
}

/* =========================================================
   Outils
   ========================================================= */
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function player(id) { for (var i = 0; i < S.players.length; i++) if (S.players[i].id === id) return S.players[i]; return null; }
function initial(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
/* Sigle unique par joueur : 1 lettre, ou 2 si deux noms commencent pareil (Léa → LÉ, Lucas → LU) */
var badgeCache = { key: '', map: {} };
function badge(p) {
  var key = S.players.map(function (x) { return x.id + x.name; }).join('|');
  if (badgeCache.key !== key) {
    var map = {}, letters = function (n) { return Array.from((n || '?').trim().replace(/\s+/g, '')); };
    var cands = function (n) {
      var L = letters(n), up = function (s) { return s.toUpperCase(); }, out = [up(L[0] || '?')];
      if (L[1]) out.push(up(L[0] + L[1]));
      if (L.length > 2) out.push(up(L[0] + L[L.length - 1]));
      for (var i = 2; i < L.length; i++) out.push(up(L[0] + L[i]));
      return out;
    };
    var clash = function (c, level) {
      return S.players.filter(function (x) { var k = cands(x.name); return (k[Math.min(level, k.length - 1)]) === c; }).length > 1;
    };
    S.players.forEach(function (x) {
      var k = cands(x.name), chosen = null;
      for (var lv = 0; lv < k.length && !chosen; lv++) {
        var used = Object.keys(map).map(function (id) { return map[id]; });
        if (!clash(k[lv], lv) && used.indexOf(k[lv]) < 0) chosen = k[lv];
        else if (lv > 0 && used.indexOf(k[lv]) < 0 && !S.players.some(function (y) { return y.id !== x.id && cands(y.name)[0] === k[0] && !map[y.id] && cands(y.name)[lv] === k[lv]; })) chosen = k[lv];
      }
      map[x.id] = chosen || (k[0] + (S.players.indexOf(x) + 1));
    });
    badgeCache = { key: key, map: map };
  }
  return badgeCache.map[p.id] || initial(p.name);
}
function badgeScale(txt) { return Array.from(txt).length > 1 ? 0.78 : 1; }
function pairKey(themeId, p) { return themeId + '|' + [p[0], p[1]].sort().join('|'); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, ''); }
function avatar(p, size) {
  size = size || 32; var b = badge(p);
  return '<span class="avatar" style="background:' + p.color + ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.44 * badgeScale(b)) + 'px;letter-spacing:-.5px" aria-hidden="true">' + esc(b) + '</span>';
}
function bigAvatar(p, size) {
  var b = badge(p);
  return '<span class="big-avatar" style="background:' + p.color + ';width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.56 * badgeScale(b)) + 'px" aria-hidden="true">' + esc(b) + '</span>';
}
var ICON = {
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  lock: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5C542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  lockDark: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#10131C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  target: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E5533D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>',
  cross: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5533D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10131C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  eyeOff: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA3B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.6M6.5 7.5C4.3 9.1 3 12 3 12s4 6 9 6a9 9 0 0 0 4-1"/></svg>',
  ghost: '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#10131C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V10a7 7 0 0 1 14 0v11l-2.5-2-2.3 2-2.2-2-2.2 2-2.3-2z"/><circle cx="9.5" cy="10.5" r="1"/><circle cx="14.5" cy="10.5" r="1"/></svg>'
};
/* Fenêtre de confirmation au style du jeu (remplace confirm() du navigateur) */
var openModal = null;
function ask(opts) {
  return new Promise(function (resolve) {
    if (openModal) openModal.close(false);
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<h2 id="mTitle">' + esc(opts.title) + '</h2>' + (opts.text ? '<p>' + esc(opts.text) + '</p>' : '') +
      '<div class="grid2" style="margin-top:4px"><button class="btn ghost" data-m="0">' + esc(opts.cancel || 'Annuler') + '</button>' +
      '<button class="btn' + (opts.danger ? ' red' : '') + '" data-m="1">' + esc(opts.ok || 'Confirmer') + '</button></div></div>';
    var prevFocus = document.activeElement;
    function close(val) {
      if (!back.parentNode) return;
      back.remove(); document.removeEventListener('keydown', onKey, true); openModal = null;
      try { if (prevFocus && prevFocus.focus) prevFocus.focus(); } catch (e) {}
      resolve(val);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(false); }
      if (e.key === 'Tab') {
        var b = back.querySelectorAll('button'), first = b[0], last = b[b.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    back.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (b) { e.stopPropagation(); close(b.getAttribute('data-m') === '1'); }
      else if (e.target === back) close(false);
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(back);
    openModal = { close: close };
    back.querySelector('[data-m="1"]').focus();
  });
}
function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
}

/* =========================================================
   Son, vibration, écran allumé
   ========================================================= */
var audioCtx = null;
function beep(freq, dur, vol) {
  try {
    var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    if (!audioCtx) audioCtx = new C();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function ring() {
  beep(880, 0.25); setTimeout(function () { beep(660, 0.25); }, 260); setTimeout(function () { beep(990, 0.45); }, 520);
  vibrate([200, 100, 200]);
}
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
var wakeLock = null;
function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; w.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
    } else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.round) keepAwake(true); });

/* =========================================================
   Règles de composition
   ========================================================= */
function maxIntruders(n) { return Math.floor((n - 1) / 2); }
function effectiveSetup() {
  var n = S.players.length, st = S.settings;
  if (st.mode === 'recrue') return { taupes: 1, fantome: false };
  var taupes = Math.min(st.taupes, n >= 7 ? 2 : 1);
  var fantome = st.fantome && n >= 5;
  while (taupes + (fantome ? 1 : 0) > maxIntruders(n)) { if (fantome) fantome = false; else taupes--; }
  return { taupes: Math.max(1, taupes), fantome: fantome };
}
function availablePairs() {
  var out = [];
  THEMES.forEach(function (t) {
    if (S.themesOn.indexOf(t.id) < 0) return;
    t.paires.forEach(function (p) {
      if (!S.settings.niveaux[p[2]]) return;
      if (S.history[pairKey(t.id, p)]) return;
      out.push({ theme: t, pair: p });
    });
  });
  return out;
}
function themeCounts(t) {
  var total = 0, left = 0;
  t.paires.forEach(function (p) {
    if (!S.settings.niveaux[p[2]]) return;
    total++; if (!S.history[pairKey(t.id, p)]) left++;
  });
  return { total: total, left: left };
}

/* =========================================================
   Déroulé d'une manche
   ========================================================= */
function startRound() {
  if (S.players.length < 3) { toast('Il faut au moins 3 joueurs.'); return; }
  var pool = availablePairs();
  if (!pool.length) { go('noPairs'); return; }
  var chosen = pick(pool);
  S.history[pairKey(chosen.theme.id, chosen.pair)] = Date.now();
  var swap = Math.random() < 0.5;
  var setup = effectiveSetup();
  var ids = shuffle(S.players.map(function (p) { return p.id; }));
  var roles = {}, k = 0;
  for (var i = 0; i < setup.taupes; i++) roles[ids[k++]] = 'taupe';
  if (setup.fantome) roles[ids[k++]] = 'fantome';
  for (; k < ids.length; k++) roles[ids[k]] = 'agent';
  S.manche++;
  // Ordre de distribution des mots tiré au sort, sans redonner le téléphone
  // en premier au même joueur que la manche précédente
  var distOrder = shuffle(S.players.map(function (p) { return p.id; }));
  if (distOrder.length > 1 && distOrder[0] === S.lastDistFirst) {
    var j = 1 + Math.floor(Math.random() * (distOrder.length - 1));
    var tmp = distOrder[0]; distOrder[0] = distOrder[j]; distOrder[j] = tmp;
  }
  S.lastDistFirst = distOrder[0];
  S.round = {
    distOrder: distOrder,
    theme: chosen.theme, level: chosen.pair[2],
    agentsWord: swap ? chosen.pair[1] : chosen.pair[0],
    taupeWord: swap ? chosen.pair[0] : chosen.pair[1],
    roles: roles, mode: S.settings.mode,
    alive: S.players.map(function (p) { return p.id; }),
    out: [], delta: {}, dist: { idx: 0, open: false, seen: false },
    clue: null, vote: null, accused: null, lastChance: null, events: []
  };
  S.players.forEach(function (p) { S.round.delta[p.id] = 0; });
  persist();
  keepAwake(true);
  go('pass');
}
/* Mot inconnu : nouvelle paire (même thème si possible), mêmes rôles, distribution relancée */
function replaceWord() {
  var r = S.round, pool = availablePairs();
  if (!pool.length) { toast('Plus aucune paire disponible dans tes thèmes.'); return; }
  var same = pool.filter(function (x) { return x.theme.id === r.theme.id; });
  var chosen = pick(same.length ? same : pool);
  S.history[pairKey(chosen.theme.id, chosen.pair)] = Date.now();
  var swap = Math.random() < 0.5;
  r.theme = chosen.theme; r.level = chosen.pair[2];
  r.agentsWord = swap ? chosen.pair[1] : chosen.pair[0];
  r.taupeWord = swap ? chosen.pair[0] : chosen.pair[1];
  r.dist = { idx: 0, open: false, seen: false };
  r.wordChanged = true;
  persist();
  go('pass');
}
function addPoints(id, n, why) {
  if (!n) return;
  var p = player(id); if (!p) return;
  p.score = (p.score || 0) + n; S.round.delta[id] += n;
  if (why) S.round.events.push(p.name + ' : +' + n + ' (' + why + ')');
}
function isIntruder(id) { return S.round.roles[id] !== 'agent'; }
function aliveIntruders() { return S.round.alive.filter(isIntruder); }
function aliveAgents() { return S.round.alive.filter(function (id) { return !isIntruder(id); }); }

/* Premier à parler : tiré au sort parmi ceux qui ont le moins souvent commencé,
   jamais le Fantôme, et si possible ni le premier de la manche précédente
   ni celui qui a reçu le téléphone en premier. */
function chooseStarter(alive) {
  var r = S.round;
  var cand = alive.filter(function (id) { return r.roles[id] !== 'fantome'; });
  if (!cand.length) cand = alive.slice();
  var avoid = [S.lastStarter, r.distOrder[0]];
  var pool = cand.filter(function (id) { return avoid.indexOf(id) < 0; });
  if (!pool.length) pool = cand.filter(function (id) { return id !== S.lastStarter; });
  if (!pool.length) pool = cand;
  var min = Math.min.apply(null, pool.map(function (id) { return S.starts[id] || 0; }));
  pool = pool.filter(function (id) { return (S.starts[id] || 0) === min; });
  var first = pick(pool);
  S.starts[first] = (S.starts[first] || 0) + 1;
  S.lastStarter = first;
  persist();
  return first;
}
function setupClues(tours) {
  var first = chooseStarter(S.round.alive);
  var order = [first].concat(shuffle(S.round.alive.filter(function (id) { return id !== first; })));
  S.round.clue = { tour: 1, tours: tours, order: order, idx: 0, running: false, left: S.settings.chrono, timedOut: false };
  go('clue');
}

/* ---------- Chrono ---------- */
var clueTimer = null, autoGoTimer = null;
function stopClueTimer() { if (clueTimer) { clearInterval(clueTimer); clueTimer = null; } if (autoGoTimer) { clearTimeout(autoGoTimer); autoGoTimer = null; } }
function clueGo() {
  var c = S.round.clue; if (c.running) return;
  stopClueTimer();
  c.running = true; c.left = S.settings.chrono; c.timedOut = false;
  beep(700, 0.06);
  render();
  clueTimer = setInterval(function () {
    c.left--;
    if (c.left <= 0) { ring(); c.timedOut = true; clueNext(true); return; }
    if (c.left <= 3) beep(520, 0.08);
    updateClueTimer();
  }, 1000);
}
function clueNext(timeout) {
  var c = S.round.clue; stopClueTimer();
  c.running = false; c.left = S.settings.chrono;
  if (timeout) toast('Temps écoulé !');
  c.idx++;
  if (c.idx >= c.order.length) {
    c.tour++; c.idx = 0;
    if (c.tour > c.tours) { afterClues(); return; }
  }
  render();
  scheduleAutoGo();
}
/* ---------- Débat (optionnel) ---------- */
var debateTimer = null;
function stopDebate() { if (debateTimer) { clearInterval(debateTimer); debateTimer = null; } }
function afterClues() {
  stopClueTimer();
  if (S.settings.debat > 0) {
    S.round.debate = { left: S.settings.debat, total: S.settings.debat, paused: false };
    go('debate');
    beep(700, 0.06);
    debateTimer = setInterval(function () {
      var d = S.round && S.round.debate; if (!d || d.paused) return;
      d.left--;
      if (d.left <= 0) { stopDebate(); ring(); toast('Fin du débat : on vote !'); go('voteChoice'); return; }
      if (d.left <= 3) beep(520, 0.08);
      if (d.left === 30 && d.total > 30) { beep(880, 0.12); toast('Plus que 30 secondes'); }
      updateDebateTimer();
    }, 1000);
  } else go('voteChoice');
}
function fmtLong(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function updateDebateTimer() {
  var d = S.round.debate, circ = 2 * Math.PI * 78, urgent = d.left <= 10;
  var el = document.getElementById('debArc');
  if (el) { el.setAttribute('stroke-dashoffset', String(circ * (1 - d.left / d.total))); el.setAttribute('stroke', urgent ? '#E5533D' : '#F5C542'); }
  var tx = document.getElementById('debTime');
  if (tx) { tx.textContent = fmtLong(d.left); tx.style.color = urgent ? '#E5533D' : '#EDE6D6'; }
}
function scheduleAutoGo() {
  if (S.settings.autoGo && S.screen === 'clue') {
    autoGoTimer = setTimeout(function () { if (S.screen === 'clue') clueGo(); }, 1500);
  }
}
function updateClueTimer() {
  var c = S.round.clue, total = S.settings.chrono;
  var urgent = c.left <= 5;
  var circ = 2 * Math.PI * 78;
  var el = document.getElementById('ringArc');
  if (el) { el.setAttribute('stroke-dashoffset', String(circ * (1 - c.left / total))); el.setAttribute('stroke', urgent ? '#E5533D' : '#6FB7FF'); }
  var tx = document.getElementById('ringTime');
  if (tx) { tx.textContent = fmtTime(c.left); tx.style.color = urgent ? '#E5533D' : '#6FB7FF'; }
}
/* Taille du mot selon la longueur du mot le plus long, pour ne jamais couper un mot en deux */
function wordSize(w) {
  var L = 0; String(w).split(/[\s]+/).forEach(function (t) { if (t.length > L) L = t.length; });
  if (L <= 7) return 'clamp(44px,15vw,64px)';
  if (L <= 10) return 'clamp(38px,12vw,52px)';
  if (L <= 13) return 'clamp(30px,9.5vw,42px)';
  if (L <= 17) return 'clamp(24px,7.5vw,34px)';
  return 'clamp(20px,6vw,28px)';
}
function fmtTime(s) { return '0:' + (s < 10 ? '0' : '') + s; }

/* ---------- Vote ---------- */
function startSecretVote(candidates, tieCount) {
  S.round.vote = { mode: 'secret', voters: S.round.alive.slice(), vIdx: 0, votes: {}, candidates: candidates || S.round.alive.slice(), tieCount: tieCount || 0, sel: null };
  go('votePass');
}
function startPointez(candidates, tieCount) {
  S.round.vote = { mode: 'pointez', voters: S.round.alive.slice(), votes: {}, candidates: candidates || S.round.alive.slice(), tieCount: tieCount || 0 };
  S.round.pointez = { stage: 'ready' };
  go('pointez');
}
/* Les deux modes de vote passent par ce même dépouillement */
function tallyVotes() {
  var v = S.round.vote, counts = {};
  Object.keys(v.votes).forEach(function (voter) { var t = v.votes[voter]; counts[t] = (counts[t] || 0) + 1; });
  var max = 0; Object.keys(counts).forEach(function (k) { if (counts[k] > max) max = counts[k]; });
  var top = Object.keys(counts).filter(function (k) { return counts[k] === max; });
  v.counts = counts;
  if (top.length === 1) { accuse(top[0]); return; }
  v.tied = top;
  if (v.tieCount >= 1) { v.drawn = pick(top); go('tieDraw'); }
  else go('tie');
}
function accuse(id) {
  var r = S.round; r.accused = id; r.revealStage = null;
  var role = r.roles[id];
  // Même barème pour les deux votes : +1 à chaque agent qui a voté contre l'intrus démasqué
  if (role !== 'agent' && r.vote && r.vote.votes) {
    Object.keys(r.vote.votes).forEach(function (voter) {
      if (r.vote.votes[voter] === id && r.roles[voter] === 'agent') addPoints(voter, 1, 'a démasqué ' + (role === 'fantome' ? 'le Fantôme' : 'la taupe'));
    });
  }
  // On garde les votes pour les montrer au verdict
  r.lastVotes = r.vote && r.vote.votes ? { votes: r.vote.votes, drawn: !!r.vote.drawn && r.vote.drawn === id } : null;
  r.alive = r.alive.filter(function (x) { return x !== id; });
  r.out.push(id);
  go('reveal');
}
function afterReveal() {
  var r = S.round, id = r.accused;
  if (isIntruder(id)) { r.lastChance = { guess: '' }; go('lastChance'); return; }
  checkEnd();
}
function judgeLastChance(ok) {
  var r = S.round, id = r.accused;
  if (ok) addPoints(id, r.roles[id] === 'fantome' ? 2 : 1, 'dernière chance réussie');
  r.lastChance.result = ok;
  checkEnd();
}
function checkEnd() {
  var r = S.round;
  var intr = aliveIntruders(), agents = aliveAgents();
  if (r.mode === 'recrue') {
    if (isIntruder(r.accused)) endRound('agents');
    else endRound('intrus');
    return;
  }
  if (!intr.length) { endRound('agents'); return; }
  if (intr.length >= agents.length) { endRound('intrus'); return; }
  go('continue');
}
function endRound(winner) {
  var r = S.round; r.winner = winner;
  if (winner === 'intrus') {
    aliveIntruders().forEach(function (id) { addPoints(id, r.roles[id] === 'fantome' ? 4 : 3, 'a survécu jusqu’au bout'); });
  }
  persist();
  go('roundEnd');
}

/* =========================================================
   Navigation et rendu
   ========================================================= */
/* Écrans hors partie : le bouton retour du téléphone y ramène à l'écran précédent */
var MENU_SCREENS = ['home', 'rules', 'briefing', 'themes', 'noPairs', 'podium'];
var navStack = [];
function go(screen, isBack) {
  if (screen !== 'clue') stopClueTimer();
  if (screen !== 'debate') stopDebate();
  if (S.screen === 'pointez' && screen !== 'pointez') stopPointez();
  if (screen === 'home') navStack = [];
  else if (!isBack && screen !== S.screen && MENU_SCREENS.indexOf(S.screen) >= 0 && MENU_SCREENS.indexOf(screen) >= 0) {
    navStack.push(S.screen); if (navStack.length > 20) navStack.shift();
  }
  S.screen = screen;
  render();
  window.scrollTo(0, 0);
  if (screen === 'clue') scheduleAutoGo();
}
function leaveGame() { stopClueTimer(); stopPointez(); S.round = null; keepAwake(false); go('home', true); }
function quitGame() {
  ask({ title: 'Quitter la partie ?', text: 'La manche en cours sera abandonnée. Les scores sont conservés.', ok: 'Quitter', cancel: 'Rester', danger: true })
    .then(function (yes) { if (yes) leaveGame(); });
}
/* Bouton retour du téléphone. Renvoie false quand on est à l'accueil : on laisse alors sortir de l'appli. */
function handleBack() {
  if (openModal) { openModal.close(false); return true; }
  if (S.round && MENU_SCREENS.indexOf(S.screen) < 0) {
    if (S.screen === 'word') { S.round.dist.open = false; go('pass', true); return true; }
    if (S.screen === 'roundEnd') { leaveGame(); return true; }
    quitGame();
    return true;
  }
  if (S.screen === 'home') return false;
  go(navStack.pop() || 'home', true);
  return true;
}
try {
  history.replaceState({ laTaupe: 'base' }, '');
  history.pushState({ laTaupe: 'app' }, '');
  window.addEventListener('popstate', function () {

V.briefing = function () {

    (n < 12 ? '<form class="row" data-form="addPlayer" style="gap:8px"><label for="newName" class="sr">Nom du joueur</label>' +
      '<input id="newName" class="input" maxlength="16" autocomplete="off" placeholder="Nom de code du joueur">' +
      '<button class="btn small" type="submit" style="background:var(--surface2);color:var(--text)">Ajouter</button></form>' : '') +

  '</section>' +
  '<section class="col"><h2 style="margin:0;font-size:15px">Mode de jeu</h2>' +
    '<div class="seg"><button class="' + (!conf ? 'on' : '') + '" data-act="set" data-arg="mode:recrue">Recrue</button>' +
    '<button class="' + (conf ? 'on' : '') + '" data-act="set" data-arg="mode:confirme">Agent confirmé</button></div>' +
    '<p class="hint" style="margin:0">' + (conf ? 'Élimination à chaque vote jusqu’à démasquer tous les intrus.' : 'Une taupe, un seul vote. Parfait pour découvrir le jeu.') + '</p>' +
  '</section>' +
  '<section class="col"><h2 style="margin:0;font-size:15px">Réglages</h2><div class="list">' +
    (conf ? '<div class="item"><span class="grow" style="font-size:14px">Taupes<br><span class="hint">2 taupes dès 7 joueurs</span></span>' +
      stepper('taupes', setup.taupes) + '</div>' +
      '<div class="item"><span class="grow" style="font-size:14px">Mode Fantôme<br><span class="hint">Écran vide, ne parle jamais en premier · dès 5 joueurs</span></span>' +
      '<button class="toggle' + (st.fantome ? ' on' : '') + '" role="switch" aria-checked="' + st.fantome + '" aria-label="Mode Fantôme" data-act="toggle" data-arg="fantome"></button></div>' : '') +
    '<div class="item"><span class="grow" style="font-size:14px">Tours d’indices</span>' + stepper('tours', st.tours) + '</div>' +
    '<div class="item"><span class="grow" style="font-size:14px">Chrono par indice</span>' + stepper('chrono', st.chrono + ' s') + '</div>' +
    '<div class="item" style="flex-wrap:wrap;padding-top:12px;padding-bottom:12px"><span style="font-size:14px;flex-basis:100%">Débat avant le vote<br><span class="hint">Chrono pour discuter avant de voter</span></span>' +
      '<div class="chips" style="margin-top:4px">' + [[0, 'Non'], [60, '1 min'], [120, '2 min']].map(function (o) {
        return '<button class="chip' + (st.debat === o[0] ? ' on' : '') + '" data-act="debat" data-arg="' + o[0] + '" aria-pressed="' + (st.debat === o[0]) + '">' + o[1] + '</button>';
      }).join('') + '</div></div>' +
    '<div class="item"><span class="grow" style="font-size:14px">Départ automatique du chrono</span>' +
      '<button class="toggle' + (st.autoGo ? ' on' : '') + '" role="switch" aria-checked="' + st.autoGo + '" aria-label="Départ automatique du chrono" data-act="toggle" data-arg="autoGo"></button></div>' +
  '</div></section>' +
  '<section class="col"><h2 style="margin:0;font-size:15px">Difficulté des mots</h2><div class="chips">' +
    ['F', 'M', 'E'].map(function (l) { return '<button class="chip' + (st.niveaux[l] ? ' on' : '') + '" data-act="level" data-arg="' + l + '" aria-pressed="' + st.niveaux[l] + '">' + LEVELS[l] + '</button>'; }).join('') +
  '</div></section>' +
  '<button class="vote-card" data-act="go" data-arg="themes"><span class="grow"><b>Thèmes</b><br><span class="hint">' + nThemes + ' thème' + (nThemes > 1 ? 's' : '') + ' · ' + nPairs + ' paire' + (nPairs > 1 ? 's' : '') + ' disponible' + (nPairs > 1 ? 's' : '') + '</span></span>' +
    '<span style="transform:rotate(180deg);display:flex">' + ICON.back + '</span></button>' +
  '<button class="btn push" data-act="start"' + (n < 3 || !nPairs ? ' disabled' : '') + '>Lancer la mission</button>' +
  '</div>';
};
function stepper(key, val) {
  return '<div class="stepper"><button data-act="step" data-arg="' + key + ':-1" aria-label="Moins">−</button><span>' + val + '</span>' +
    '<button data-act="step" data-arg="' + key + ':1" aria-label="Plus">+</button></div>';
}

V.themes = function () {
  var groups = {};
  THEMES.forEach(function (t) { (groups[t.groupe] = groups[t.groupe] || []).push(t); });
  var html = '<div class="screen">' + backTop('ARCHIVES', S.round ? 'home' : 'briefing') +
    '<div class="card" style="border:1px dashed var(--line2)"><b style="font-size:15px">Missions sur mesure (IA)</b>' +
    '<p class="hint" style="margin:6px 0 0">Bientôt&nbsp;: tape un thème, l’IA crée les paires. Cette fonction demande un serveur, elle viendra dans une prochaine version.</p></div>';
  Object.keys(groups).forEach(function (g) {
    var list = groups[g], allOn = list.every(function (t) { return S.themesOn.indexOf(t.id) >= 0; });
    html += '<section class="col"><div class="row between"><h2 style="margin:0;font-size:15px">' + esc(g) + '</h2>' +
      '<button class="link" style="padding:6px" data-act="themeGroup" data-arg="' + esc(g) + '">' + (allOn ? 'Tout retirer' : 'Tout cocher') + '</button></div>' +
      '<div class="list">' + list.map(function (t) {
        var on = S.themesOn.indexOf(t.id) >= 0, c = themeCounts(t);
        var pct = c.total ? Math.round((c.total - c.left) / c.total * 100) : 0;
        return '<button class="theme-row" data-act="theme" data-arg="' + t.id + '" aria-pressed="' + on + '">' +
          '<span class="check' + (on ? ' on' : '') + '">' + (on ? ICON.check : '') + '</span>' +
          '<span class="grow"><span style="font-weight:600;font-size:15px">' + esc(t.nom) + '</span><br>' +
          '<span class="hint">' + c.left + ' / ' + c.total + ' paires restantes</span>' +
          '<span class="bar" style="display:block"><span style="width:' + pct + '%"></span></span></span></button>';
      }).join('') + '</div></section>';
  });
  html += '<p class="hint" style="margin:0">Une paire déjà jouée ne revient pas tant que tu ne remets pas l’historique à zéro.</p>' +
    '<button class="btn ghost" data-act="resetHistory">Remettre l’historique à zéro</button>' +
    '<button class="btn" data-act="go" data-arg="briefing">Valider</button></div>';
  return html;
};

V.noPairs = function () {
  return '<div class="screen">' + backTop('PLUS DE MOTS', 'briefing') +
    '<p class="text2" style="font-size:16px;line-height:1.5">Toutes les paires des thèmes et niveaux choisis ont déjà été jouées.</p>' +
    '<div class="col push"><button class="btn" data-act="go" data-arg="themes">Choisir d’autres thèmes</button>' +
    '<button class="btn ghost" data-act="resetHistoryStart">Remettre l’historique à zéro et jouer</button></div></div>';
};

V.pass = function () {
  var r = S.round, p = player(r.distOrder[r.dist.idx]);
  var dots = r.distOrder.map(function (x, i) {
    var col = i < r.dist.idx ? 'var(--blue)' : (i === r.dist.idx ? 'var(--yellow)' : 'var(--line)');

    '<div class="row" style="gap:6px;justify-content:center;width:100%" aria-label="Joueur ' + (r.dist.idx + 1) + ' sur ' + S.players.length + '">' + dots + '</div>' +
    '<div class="col center" style="align-items:center;gap:16px;margin-top:28px">' +
      '<div style="display:flex;justify-content:center;align-items:center;width:150px;height:150px;border-radius:50%;border:2px dashed var(--line2)">' + bigAvatar(p, 118) + '</div>' +
      '<p style="margin:0;font-size:16px" class="text2">Passe le téléphone à</p>' +
      '<h1 class="display h-xl" style="word-break:break-word">' + esc(p.name.toUpperCase()) + '</h1></div>' +
    (r.wordChanged ? '<div class="card" style="border:1px solid var(--yellow);text-align:center;font-size:14px"><b style="color:var(--yellow)">Nouveau mot&nbsp;!</b> Tout le monde relit son dossier.</div>' : '') +

V.word = function () {
  var r = S.round, p = player(r.distOrder[r.dist.idx]), role = r.roles[p.id], d = r.dist;
  var inner;
  if (!d.open) {
    inner = '<span class="col" style="align-items:center;gap:12px">' + ICON.lockDark +
      '<span style="font-size:17px;font-weight:600">Touche pour ouvrir</span>' +
      '<span style="font-size:13px;color:#4A4436">Vérifie que personne ne regarde</span></span>';
  } else if (role === 'fantome') {
    inner = '<span class="col" style="align-items:center;gap:10px">' + ICON.ghost +
      '<span class="word">LE FANTÔME</span>' +
      '<span style="font-size:14px;line-height:1.45;max-width:260px;color:#4A4436">Tu n’as pas de mot. Écoute les indices, devine le mot des agents et bluffe&nbsp;!</span>' +
      '<span class="pill">Catégorie · ' + esc(r.theme.nom) + '</span></span>';
  } else {
    var w = role === 'taupe' ? r.taupeWord : r.agentsWord;
    inner = '<span class="col" style="align-items:center;gap:10px">' +
      '<span style="font-family:var(--mono);font-size:12px;letter-spacing:2px;color:#6B6250">TON MOT DE CODE</span>' +
      '<span class="word" style="font-size:' + wordSize(w) + '">' + esc(w.toUpperCase()) + '</span>' +
      '<span class="pill">Catégorie · ' + esc(r.theme.nom) + '</span></span>';

      '<span class="tab"></span><span class="label">DOSSIER PERSONNEL</span>' + inner + '</button>' +
    '<p class="center muted" style="margin:0;font-size:14px;line-height:1.5">' + (role === 'fantome' && d.open ? 'Tu ne parleras jamais en premier.' : 'Personne ne sait s’il est la taupe.<br>Pas même toi.') + '</p>' +
    // Bouton « mot inconnu » : pour tous ceux qui ont un mot
    (d.open && role !== 'fantome' ? '<button class="link" data-act="unknownWord">Je ne connais pas ce mot</button>' : '') +
    '<button class="btn push" data-act="distNext"' + (d.seen ? '' : ' disabled') + '>' + (last ? 'Mémorisé, on commence' : 'Mémorisé, je passe') + '</button></div>';
};

V.clue = function () {
  var r = S.round, c = r.clue, cur = player(c.order[c.idx]), total = S.settings.chrono;
  var circ = 2 * Math.PI * 78, urgent = c.running && c.left <= 5;
  var order = c.order.map(function (id, i) {
    var p = player(id), now = i === c.idx, done = i < c.idx;
    var status = now ? (c.running ? 'parle' : 'à toi') : (done ? 'fait' : 'en attente');
    var col = now ? 'var(--blue)' : (done ? 'var(--green)' : 'var(--muted)');
    return '<div class="score-row" style="min-height:42px;' + (now ? 'background:#1A2333;outline:1px solid var(--blue)' : '') + '">' +
      '<span class="mono" style="letter-spacing:0;width:16px">' + (i + 1) + '</span>' + avatar(p, 26) +
      '<span class="pname">' + esc(p.name) + '</span><span style="font-size:12px;color:' + col + '">' + status + '</span></div>';
  }).join('');
  return '<div class="screen">' + gameTop('Tour d’indices ' + c.tour + ' / ' + c.tours + ' · ' + esc(r.theme.nom)) +
    '<div class="ring"><svg width="176" height="176" viewBox="0 0 176 176" aria-hidden="true">' +
      '<circle cx="88" cy="88" r="78" fill="none" stroke="#1A1F2C" stroke-width="10"/>' +
      '<circle id="ringArc" cx="88" cy="88" r="78" fill="none" stroke="' + (urgent ? '#E5533D' : '#6FB7FF') + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - c.left / total)) + '" style="transition:stroke-dashoffset .9s linear"/></svg>' +
      '<div class="in">' + bigAvatar(cur, 74) +
      '<span id="ringTime" role="timer" style="margin-top:6px;font-family:var(--mono);font-weight:600;font-size:15px;color:' + (urgent ? '#E5533D' : '#6FB7FF') + '">' + fmtTime(c.left) + '</span></div></div>' +
    '<div class="col center" style="gap:6px"><h1 class="display h-m">À ' + esc(cur.name.toUpperCase()) + ' DE PARLER</h1>' +
      '<p class="text2" style="margin:0;font-size:15px">' + (c.running ? 'Un seul mot lié au tien. Pas trop précis…' : (S.settings.autoGo ? 'Le chrono démarre…' : 'Touche « Go » quand tu es prêt.')) + '</p></div>' +
    '<section class="col" style="gap:6px"><h2 class="hint" style="margin:0;font-weight:600">Ordre de parole (tiré au sort)</h2>' + order + '</section>' +
    '<div class="col push">' +
      (c.running ? '<button class="btn blue" data-act="clueNext">Indice donné</button>'
                 : '<button class="btn" data-act="clueGo" style="font-size:20px">Go, ' + esc(cur.name) + '</button>') +
      '<button class="link" data-act="skipToVote">Passer directement au vote</button></div></div>';
};

V.debate = function () {
  var d = S.round.debate, circ = 2 * Math.PI * 78, urgent = d.left <= 10;
  return '<div class="screen">' + gameTop('Débat · ' + esc(S.round.theme.nom)) +
    '<div class="col center grow" style="align-items:center;justify-content:center;gap:20px">' +
      '<div class="ring"><svg width="176" height="176" viewBox="0 0 176 176" aria-hidden="true">' +
        '<circle cx="88" cy="88" r="78" fill="none" stroke="#1A1F2C" stroke-width="10"/>' +
        '<circle id="debArc" cx="88" cy="88" r="78" fill="none" stroke="' + (urgent ? '#E5533D' : '#F5C542') + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - d.left / d.total)) + '" style="transition:stroke-dashoffset .9s linear"/></svg>' +
        '<div class="in"><span id="debTime" role="timer" class="display" style="font-size:56px;color:' + (urgent ? '#E5533D' : '#EDE6D6') + '">' + fmtLong(d.left) + '</span>' +
        (d.paused ? '<span class="mono" style="color:var(--yellow)">En pause</span>' : '') + '</div></div>' +
      '<h1 class="display h-l">DÉBATTEZ&nbsp;!</h1>' +
      '<p class="text2" style="margin:0;font-size:15px;line-height:1.5">Accusez, défendez-vous, demandez des explications sur les indices.<br>Personne ne montre son mot&nbsp;!</p></div>' +
    '<div class="grid2"><button class="btn ghost" data-act="debatePause">' + (d.paused ? 'Reprendre' : 'Pause') + '</button>' +
    '<button class="btn" data-act="debateEnd">Passer au vote</button></div></div>';
};

V.voteChoice = function () {

    '<div class="col push" style="gap:12px">' +
      '<button class="vote-card" data-act="voteSecret"><span class="ic">' + ICON.lock + '</span><span class="col" style="gap:4px"><b style="font-size:17px">Vote secret</b><span class="hint">Le téléphone passe de main en main. Personne ne voit les votes.</span></span></button>' +
      '<button class="vote-card" style="border-color:var(--red)" data-act="votePointez"><span class="ic" style="background:#2A1A1A">' + ICON.target + '</span><span class="col" style="gap:4px"><b style="font-size:17px">3, 2, 1, pointez&nbsp;!</b><span class="hint">Tout le monde désigne son suspect en même temps, du doigt.</span></span></button>' +
    '</div></div>';
};

V.votePass = function () {
  var v = S.round.vote, p = player(v.voters[v.vIdx]);
  return '<div class="screen" style="align-items:center">' + '<div style="align-self:stretch">' + gameTop('Vote secret · ' + (v.vIdx + 1) + ' / ' + v.voters.length) + '</div>' +

    '<p style="margin:0;font-size:16px" class="text2">Passe le téléphone à</p>' +

    '<button class="btn push" data-act="voteMe">C’est moi, je vote</button></div>';

        '<p class="text2" style="margin:0;font-size:15px;line-height:1.5">Posez le téléphone au milieu de la table.<br>Au signal, pointez votre suspect du doigt<br>et ne bougez plus&nbsp;!</p>' + tieTxt + '</div>' +

  }

var pzTimer = null;

/* Qui a voté contre qui (montré avant la révélation) */
function votesBlock() {
  var r = S.round, lv = r.lastVotes;
  if (!lv || !lv.votes || !Object.keys(lv.votes).length) return '';
  var byTarget = {};
  Object.keys(lv.votes).forEach(function (voter) { (byTarget[lv.votes[voter]] = byTarget[lv.votes[voter]] || []).push(voter); });
  var targets = Object.keys(byTarget).sort(function (a, b) { return byTarget[b].length - byTarget[a].length; });
  return '<div class="card" style="width:100%;text-align:left;padding:12px 14px"><span class="mono" style="letter-spacing:1px">Les votes</span>' +
    targets.map(function (t) {
      var tp = player(t), n = byTarget[t].length;
      return '<div class="row" style="gap:10px;margin-top:10px;align-items:flex-start">' + avatar(tp, 26) +
        '<span class="grow" style="font-size:14px;line-height:1.4"><b>' + esc(tp.name) + '</b> <span class="muted">· ' + n + ' vote' + (n > 1 ? 's' : '') + '</span><br>' +
        '<span class="text2">' + byTarget[t].map(function (v) { return esc(player(v).name); }).join(', ') + '</span></span></div>';
    }).join('') + '</div>';
}
function startReveal() {
  var r = S.round; if (r.revealStage) return;
  r.revealStage = 'suspense'; render();
  // Roulement de tambour qui accélère
  var t = 0, gap = 190;
  for (var i = 0; i < 12; i++) {
    (function (d, f) { setTimeout(function () { beep(f, 0.05, 0.18); }, d); })(t, 180 + i * 12);
    t += gap; gap = Math.max(60, gap * 0.82);
  }
  vibrate([40, 120, 40, 100, 40, 80, 40, 60, 40, 40]);
  setTimeout(function () {
    if (S.screen !== 'reveal' || S.round !== r) return;
    r.revealStage = 'done'; render();
    var good = r.roles[r.accused] !== 'agent';
    if (good) { beep(140, 0.35, 0.4); setTimeout(function () { beep(990, 0.3); }, 120); }
    else { beep(300, 0.25, 0.3); setTimeout(function () { beep(220, 0.45, 0.3); }, 220); }
    vibrate(good ? [90, 40, 220] : [300]);
  }, Math.round(t) + 250);
}
function effectiveTaupes() { var n = 0; Object.keys(S.round.roles).forEach(function (k) { if (S.round.roles[k] === 'taupe') n++; }); return n; }

/* Réduit la police tant qu'un mot dépasse de son cadre (jamais de mot coupé en deux) */
function fitWords() {
  var els = document.querySelectorAll('.word, .fit');
  for (var i = 0; i < els.length; i++) {
    var el = els[i], size = parseFloat(getComputedStyle(el).fontSize), guard = 40;
    var box = el.parentElement;
    while (guard-- > 0 && size > 16 && (el.scrollWidth > el.clientWidth + 1 || el.getBoundingClientRect().width > box.clientWidth)) {
      size -= 2; el.style.fontSize = size + 'px';
    }
  }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitWords(); });
function render() {
  var app = document.getElementById('app');
  var view = V[S.screen] || V.home;
  app.innerHTML = view();
  fitWords();
  if (S.screen === 'briefing' && S.ui.focusAdd) { var i = document.getElementById('newName'); if (i) i.focus(); S.ui.focusAdd = false; }
  if (S.screen === 'lastChance') { var l = document.getElementById('lcInput'); if (l) l.focus(); }
}

/* =========================================================
   Actions
   ========================================================= */
var A = {
  go: function (to) { go(to); },
  quit: quitGame,
  delPlayer: function (id) { S.players = S.players.filter(function (p) { return p.id !== id; }); recolor(); persist(); render(); },
  resetScores: function () {
    ask({ title: 'Scores à zéro ?', text: 'Tous les joueurs repartent de 0 point.', ok: 'Remettre à zéro', danger: true }).then(function (yes) {
      if (!yes) return; S.players.forEach(function (p) { p.score = 0; }); S.manche = 0; persist(); render();
    });
  },
  set: function (arg) { var kv = arg.split(':'); S.settings[kv[0]] = kv[1]; persist(); render(); },
  toggle: function (k) { S.settings[k] = !S.settings[k]; persist(); render(); },
  step: function (arg) {
    var kv = arg.split(':'), k = kv[0], d = +kv[1], st = S.settings;
    if (k === 'taupes') st.taupes = Math.max(1, Math.min(2, effectiveSetup().taupes + d));
    if (k === 'tours') st.tours = Math.max(1, Math.min(3, st.tours + d));
    if (k === 'chrono') st.chrono = Math.max(10, Math.min(60, st.chrono + d * 5));
    persist(); render();
    if (k === 'taupes' && d > 0 && effectiveSetup().taupes < 2) toast('2 taupes possibles à partir de 7 joueurs.');
  },
  level: function (l) {
    var nv = S.settings.niveaux; nv[l] = !nv[l];
    if (!nv.F && !nv.M && !nv.E) { nv[l] = true; toast('Garde au moins un niveau.'); }
    persist(); render();
  },
  theme: function (id) {
    var i = S.themesOn.indexOf(id);
    if (i >= 0) S.themesOn.splice(i, 1); else S.themesOn.push(id);
    persist(); render();
  },
  themeGroup: function (g) {
    var ids = THEMES.filter(function (t) { return t.groupe === g; }).map(function (t) { return t.id; });
    var allOn = ids.every(function (id) { return S.themesOn.indexOf(id) >= 0; });
    S.themesOn = S.themesOn.filter(function (id) { return ids.indexOf(id) < 0; });
    if (!allOn) S.themesOn = S.themesOn.concat(ids);
    persist(); render();
  },
  resetHistory: function () {
    ask({ title: 'Effacer l’historique ?', text: 'Toutes les paires déjà jouées redeviendront disponibles.', ok: 'Effacer' }).then(function (yes) {
      if (!yes) return; S.history = {}; persist(); render(); toast('Historique remis à zéro.');
    });
  },
  resetHistoryStart: function () { S.history = {}; persist(); startRound(); },
  start: function () { if (!S.themesOn.length) { toast('Choisis au moins un thème.'); return; } startRound(); },
  distMe: function () { S.round.dist.open = false; S.round.dist.seen = false; go('word'); },
  distToggle: function () { var d = S.round.dist; d.open = !d.open; if (d.open) d.seen = true; render(); },
  distNext: function () {
    var r = S.round; r.dist.open = false;
    r.dist.idx++;
    if (r.dist.idx >= S.players.length) { r.wordChanged = false; setupClues(S.settings.tours); return; }
    go('pass');
  },
  clueGo: clueGo,
  clueNext: function () { clueNext(false); },
  skipToVote: function () {
    ask({ title: 'Passer au vote ?', text: 'Le tour d’indices s’arrête ici.', ok: 'Passer au vote' }).then(function (yes) { if (yes) afterClues(); });
  },
  voteSecret: function () { startSecretVote(); },
  votePointez: function () { startPointez(); },
  voteMe: function () { S.round.vote.sel = null; go('voteGrid'); },
  voteSel: function (id) { S.round.vote.sel = id; render(); },
  voteConfirm: function () {
    var v = S.round.vote; if (!v.sel) return;
    v.votes[v.voters[v.vIdx]] = v.sel; v.sel = null; v.vIdx++;
    if (v.vIdx >= v.voters.length) tallyVotes(); else go('votePass');
  },
  revote: function () {
    var v = S.round.vote;
    if (v.mode === 'pointez') startPointez(v.tied, v.tieCount + 1);
    else startSecretVote(v.tied, v.tieCount + 1);
  },
  accuseDrawn: function () { accuse(S.round.vote.drawn); },
  pointezStart: pointezStart,
  debatePause: function () { var d = S.round.debate; d.paused = !d.paused; render(); },
  debateEnd: function () { stopDebate(); go('voteChoice'); },
  debat: function (v) { S.settings.debat = +v; persist(); render(); },
  unknownWord: function () {
    ask({ title: 'Mot inconnu ?', text: 'Un nouveau mot est tiré pour tout le monde, et chacun relit son dossier depuis le début. Personne ne saura qui a demandé.', ok: 'Nouveau mot', cancel: 'Je le garde' })
      .then(function (yes) { if (yes) replaceWord(); });
  },
  pointezEnd: function () { stopPointez(); S.round.pointez.stage = 'pick'; render(); },
  pzVote: function (arg) {
    var kv = arg.split(':'), v = S.round.vote;
    v.votes[kv[0]] = v.votes[kv[0]] === kv[1] ? undefined : kv[1];
    if (!v.votes[kv[0]]) delete v.votes[kv[0]];
    var y = window.scrollY; render(); window.scrollTo(0, y);
  },
  pzValidate: function () {
    var v = S.round.vote;
    if (v.voters.every(function (id) { return v.votes[id]; })) tallyVotes();
  },
  pointezAgain: function () { S.round.vote.votes = {}; S.round.pointez = { stage: 'ready' }; render(); },
  revealNow: startReveal,
  afterReveal: afterReveal,
  lcSkip: function () { S.round.lastChance = { guess: '', submitted: true }; render(); },
  lcJudge: function (v) { judgeLastChance(v === '1'); },
  nextClues: function () { setupClues(1); },
  nextRound: function () { startRound(); },
  endGame: function () { S.round = null; keepAwake(false); go('podium'); },
  newGame: function () { S.players.forEach(function (p) { p.score = 0; }); S.manche = 0; persist(); startRound(); }
};
function recolor() { S.players.forEach(function (p, i) { p.color = COLORS[i % COLORS.length]; }); }

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = A[el.getAttribute('data-act')];
  if (fn) { e.preventDefault(); fn(el.getAttribute('data-arg')); }
});
document.addEventListener('submit', function (e) {
  var f = e.target.getAttribute('data-form'); if (!f) return;
  e.preventDefault();
  if (f === 'addPlayer') {
    var inp = document.getElementById('newName'), name = (inp.value || '').trim().replace(/\s+/g, ' ');
    if (!name) return;
    if (S.players.length >= 12) { toast('12 joueurs maximum.'); return; }
    if (S.players.some(function (p) { return norm(p.name) === norm(name); })) { toast('Ce nom de code est déjà pris.'); return; }
    S.players.push({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name, color: COLORS[S.players.length % COLORS.length], score: 0 });
    persist(); S.ui.focusAdd = true; render();
  }
  if (f === 'lastChance') {
    var g = (document.getElementById('lcInput').value || '').trim();
    S.round.lastChance = { guess: g, submitted: true }; render();
  }
});
